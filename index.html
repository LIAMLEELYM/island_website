  <style>
    :root {
      --bg-cream: #f4eee1;
      --text-main: #2b2b2b;
      --text-sub: #7a7365;
      --accent-gold: #c29b38;
      --glass-bg: rgba(255, 255, 255, 0.88);
      --glass-border: rgba(210, 200, 180, 0.6);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Noto Serif HK", "Songti TC", "Segoe UI", serif;
      background: var(--bg-cream);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      user-select: none;
      -webkit-touch-callout: none;
    }

    #canvas-container {
      position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1;
      touch-action: none;
    }

    nav.top-nav {
      position: fixed; top: 0; left: 0; width: 100vw; height: 80px;
      padding: 0 4vw;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10; pointer-events: none;
    }
    .brand-logo {
      pointer-events: auto; display: flex; align-items: center; gap: 8px;
    }
    .brand-logo h1 {
      font-size: 19px; font-weight: 800; letter-spacing: 2px; color: var(--text-main);
      text-transform: uppercase; font-family: -apple-system, sans-serif;
    }
    .brand-logo span {
      font-size: 10px; color: var(--text-sub); letter-spacing: 1.5px;
      border-left: 1px solid #d0c8b6; padding-left: 8px; margin-left: 4px;
      text-transform: uppercase;
    }
    .nav-links {
      display: flex; gap: 24px; pointer-events: auto;
    }
    .nav-links button {
      background: none; border: none; font-size: 14px; font-weight: 500;
      color: var(--text-main); cursor: pointer; transition: 0.2s ease;
      padding: 6px 4px; font-family: inherit; white-space: nowrap;
    }
    .nav-links button:hover { color: var(--accent-gold); }

    .hero-container {
      position: fixed; top: 50%; left: 5vw; transform: translateY(-50%);
      width: 28vw; min-width: 300px; max-width: 420px;
      z-index: 10; pointer-events: none;
    }
    .hero-container * { pointer-events: auto; }

    .hero-subtag {
      font-size: 11px; font-weight: 700; color: var(--text-sub);
      letter-spacing: 2px; text-transform: uppercase; margin-bottom: 18px;
      display: flex; align-items: center; gap: 8px;
    }
    .hero-subtag::before {
      content: ""; display: inline-block; width: 20px; height: 1.5px; background: var(--text-sub);
    }

    .hero-title {
      font-size: clamp(34px, 3.8vw, 52px); font-weight: 800;
      line-height: 1.18; color: var(--text-main); margin-bottom: 20px;
      letter-spacing: 1px;
    }
    .hero-title .sparkle {
      color: var(--accent-gold); font-size: 28px; font-weight: 400;
    }

    .hero-desc {
      font-size: 14px; line-height: 1.9; color: var(--text-sub);
      margin-bottom: 28px; font-weight: 400;
    }

    .hero-cta {
      display: inline-flex; align-items: center; gap: 10px;
      background: #252422; color: #fff; text-decoration: none;
      padding: 12px 24px; border-radius: 28px; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(37, 36, 34, 0.15); border: none;
    }
    .hero-cta:hover {
      background: #3e3b36; transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(37, 36, 34, 0.25);
    }

    .hero-footer-tag {
      margin-top: 30px; font-size: 11px; color: #9c9382; letter-spacing: 1px;
    }

    .bottom-capsule-bar {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      padding: 6px 14px; border-radius: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      display: flex; gap: 8px; z-index: 10;
      max-width: 92vw;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .bottom-capsule-bar::-webkit-scrollbar { display: none; }

    .capsule-btn {
      background: transparent; border: none;
      padding: 8px 16px; border-radius: 24px;
      font-size: 13px; font-weight: 500; color: var(--text-main);
      cursor: pointer; transition: all 0.2s ease;
      display: inline-flex; align-items: center; gap: 6px;
      font-family: inherit;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .capsule-btn span.num {
      font-size: 11px; color: var(--text-sub); font-style: italic; font-weight: 600;
    }
    .capsule-btn:hover {
      background: rgba(244, 238, 225, 0.9); color: var(--accent-gold);
    }
    .capsule-btn.active {
      background: #252422; color: #fff;
    }
    .capsule-btn.active span.num { color: #d0c8b6; }

    .pin-label {
      position: fixed;
      transform: translate(-50%, -100%);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.2s ease, background 0.2s ease;
      z-index: 5;
      user-select: none;
      border: 1px solid rgba(255,255,255,0.8);
      white-space: nowrap;
    }
    .pin-label:hover {
      transform: translate(-50%, -108%) scale(1.05);
      background: #252422;
      color: #fff;
    }
    .pin-num {
      width: 16px; height: 16px; border-radius: 50%;
      background: #e6dfd1; color: var(--text-main); font-size: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .pin-label:hover .pin-num { background: #444; color: #fff; }

    .cat-pin {
      background: rgba(255, 248, 240, 0.96) !important;
      color: #c05621 !important;
      border: 1px solid #fbd38d !important;
    }
    .cat-pin:hover {
      background: #c05621 !important; color: #fff !important;
    }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(37, 36, 34, 0.35);
      backdrop-filter: blur(8px); z-index: 50; display: none;
      align-items: center; justify-content: center; opacity: 0;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active { display: flex; opacity: 1; }
    .modal-card {
      background: #fffdfa; width: 90%; max-width: 560px; max-height: 85vh;
      border-radius: 24px; padding: 32px; box-shadow: 0 24px 50px rgba(0,0,0,0.18);
      overflow-y: auto; position: relative; transform: translateY(20px);
      transition: transform 0.3s ease; border: 1px solid var(--glass-border);
    }
    .modal-overlay.active .modal-card { transform: translateY(0); }
    .modal-close {
      position: absolute; top: 20px; right: 20px; width: 34px; height: 34px;
      border-radius: 50%; border: none; background: #f0e9dc; color: #7a7365;
      font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { background: #252422; color: #fff; }
    .modal-card h2 { font-size: 22px; color: var(--text-main); margin-bottom: 12px; }
    .modal-card p { font-size: 14px; line-height: 1.8; color: #555045; margin-bottom: 16px; }
    .modal-tag { display: inline-block; padding: 4px 12px; background: #eee6d8; color: #7a7365; border-radius: 12px; font-size: 12px; margin-bottom: 14px; font-weight: 600; }

    #loading-screen {
      position: fixed; inset: 0; background: var(--bg-cream); z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 44px; height: 44px; border: 3px solid #d8cfc0;
      border-top-color: var(--accent-gold); border-radius: 50%;
      animation: spin 0.9s linear infinite; margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .top-nav { height: 60px; padding: 0 16px; }
      .nav-links { display: none; }

      .hero-container {
        top: 80px; left: 16px; right: 16px; transform: none;
        width: calc(100vw - 32px); min-width: unset; max-width: unset;
        text-align: left;
      }
      .hero-title { font-size: 28px; margin-bottom: 10px; }
      .hero-desc { font-size: 13px; line-height: 1.6; margin-bottom: 14px; }
      .hero-cta { padding: 8px 18px; font-size: 12px; }
      .hero-footer-tag { display: none; }

      .bottom-capsule-bar {
        bottom: 16px; padding: 4px 8px; gap: 4px;
      }
      .capsule-btn { padding: 6px 12px; font-size: 12px; }
      .pin-label { padding: 4px 8px; font-size: 11px; }
    }
  </style>
</head>

    pinkPlaidTexture.colorSpace = THREE.SRGBColorSpace; // 確保顏色飽和粉嫩，不發白

    // 使用標準 PlaneGeometry 搭配精確 UV 映射，保證照片 100% 正確鋪滿在正面！
    const rugGeo = new THREE.PlaneGeometry(0.88, 0.88);
    rugGeo.rotateX(-Math.PI / 2); // 旋轉為水平朝上

    const rugMat = new THREE.MeshBasicMaterial({
      map: pinkPlaidTexture,
      transparent: true,
      side: THREE.DoubleSide
    });
    const mainRug = new THREE.Mesh(rugGeo, rugMat);
    mainRug.position.y = 0.005;
    mainRug.rotation.y = -Math.PI * 0.08;
    rugGroup.add(mainRug);

    // 稍微墊一個極薄的柔和底襯邊框 (白色織物邊緣)
    const baseBorderGeo = new THREE.PlaneGeometry(0.91, 0.91);
    baseBorderGeo.rotateX(-Math.PI / 2);
    const baseBorder = new THREE.Mesh(baseBorderGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
    baseBorder.position.y = 0.003;
    baseBorder.rotation.y = -Math.PI * 0.08;
    rugGroup.add(baseBorder);

    // 水盆裝飾
    const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.06, 0.04, 16), new THREE.MeshBasicMaterial({color: 0x90cdf4}));
    bowl.position.set(0.48, 0.02, 0.22);
    rugGroup.add(bowl);
    const waterInBowl = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.01, 16), new THREE.MeshBasicMaterial({color: 0x63b3ed}));
    waterInBowl.position.set(0.48, 0.035, 0.22);
    rugGroup.add(waterInBowl);

    /* --------------------------------------------------------------------
     * 3. 載入藍貓 (blue cat.glb)
     * -------------------------------------------------------------------- */
    let catModel = null;
    const catGroup = new THREE.Group();
    islandGroup.add(catGroup);

    function loadCatModel() {
      loader.load(
        'blue cat.glb',
        (gltf) => {
          catModel = gltf.scene;
          const box = new THREE.Box3().setFromObject(catModel);
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);

          if (maxDim > 0) {
            const targetScale = 0.38 / maxDim;
            catModel.scale.set(targetScale, targetScale, targetScale);
          }

          catGroup.position.set(CAT_LOCAL_POS.x, CAT_LOCAL_POS.y + 0.008, CAT_LOCAL_POS.z);
          catGroup.rotation.y = Math.PI * 0.22;
          catGroup.add(catModel);

          gsap.to(catModel.rotation, {
            y: "+=0.15", duration: 3.5, repeat: -1, yoyo: true, ease: "sine.inOut"
          });

          loadingScreen.style.opacity = '0';
          setTimeout(() => { loadingScreen.style.display = 'none'; }, 500);
        },
        undefined,
        (err) => {
          console.warn('未載入到 blue cat.glb', err);
          loadingScreen.style.opacity = '0';
          setTimeout(() => { loadingScreen.style.display = 'none'; }, 500);
        }
      );
    }

    /* --------------------------------------------------------------------
     * 4. 3D 懸浮標籤生成
     * -------------------------------------------------------------------- */
    const labelElements = {};
    for (const key in BUILDING_DATA) {
      const data = BUILDING_DATA[key];
      const el = document.createElement('div');
      el.className = 'pin-label' + (data.isCat ? ' cat-pin' : '');
      el.innerHTML = `<span class="pin-num">${data.num}</span><span>${data.title}</span>`;
      document.body.appendChild(el);

      labelElements[key] = { 
        el, 
        pos: data.pinPos ? new THREE.Vector3(data.pinPos.x, data.pinPos.y, data.pinPos.z) : new THREE.Vector3(),
        isCat: data.isCat 
      };

      el.addEventListener('click', () => { focusSpot(key); });
    }

    /* --------------------------------------------------------------------
     * 5. 統一聚焦 Zoom In 控制器
     * -------------------------------------------------------------------- */
    const modalOverlay = document.getElementById('modal-overlay');
    const modalContent = document.getElementById('modal-content');
    const modalCloseBtn = document.getElementById('modal-close-btn');
    const resetCamBtn = document.getElementById('reset-cam-btn');
    const heroExploreBtn = document.getElementById('hero-explore-btn');

    function focusSpot(key) {
      const b = BUILDING_DATA[key];
      if (!b) return;

      if (b.isCat) {
        focusCat();
        return;
      }

      const targetX = b.lookTarget.x + islandGroup.position.x;
      const targetY = b.lookTarget.y + islandGroup.position.y;
      const targetZ = b.lookTarget.z + islandGroup.position.z;

      const camX = b.camPos.x + islandGroup.position.x;
      const camY = b.camPos.y + islandGroup.position.y;
      const camZ = b.camPos.z + islandGroup.position.z;

      window.gsap.to(camera.position, {
        x: camX, y: camY, z: camZ,
        duration: 1.4, ease: "power2.inOut"
      });
      window.gsap.to(controls.target, {
        x: targetX, y: targetY, z: targetZ,
        duration: 1.4, ease: "power2.inOut",
        onComplete: () => {
          modalContent.innerHTML = b.content;
          modalOverlay.classList.add('active');
        }
      });
    }

    function focusCat() {
      if (!catModel) return;

      const catPos = new THREE.Vector3();
      catGroup.getWorldPosition(catPos);

      gsap.to(catGroup.rotation, { y: 0.1, duration: 0.8, ease: "power2.out" });

      window.gsap.to(camera.position, {
        x: catPos.x + 0.6, y: catPos.y + 0.35, z: catPos.z + 1.1,
        duration: 1.3, ease: "power2.inOut"
      });
      window.gsap.to(controls.target, {
        x: catPos.x, y: catPos.y + 0.15, z: catPos.z,
        duration: 1.3, ease: "power2.inOut",
        onComplete: () => {
          modalContent.innerHTML = BUILDING_DATA.cat_spot.content;
          modalOverlay.classList.add('active');
        }
      });
    }

    function resetCamera() {
      modalOverlay.classList.remove('active');
      window.gsap.to(camera.position, {
        x: defaultCamPos.x, y: defaultCamPos.y, z: defaultCamPos.z,
        duration: 1.2, ease: "power2.inOut"
      });
      window.gsap.to(controls.target, {
        x: defaultTarget.x, y: defaultTarget.y, z: defaultTarget.z,
        duration: 1.2, ease: "power2.inOut"
      });
      if (catGroup) {
        gsap.to(catGroup.rotation, { y: Math.PI * 0.22, duration: 1.0 });
      }
    }

    document.querySelectorAll('[data-spot]').forEach(btn => {
      btn.addEventListener('click', () => {
        focusSpot(btn.dataset.spot);
      });
    });

        // 【沉浸式逛島】：點擊「去島上逛逛」只會拉近鏡頭特寫小島，不打開任何彈窗
    heroExploreBtn.onclick = () => {
      modalOverlay.classList.remove('active');
      const targetCenter = {
        x: islandGroup.position.x,
        y: 1.2,
        z: islandGroup.position.z
      };
      const exploreCamPos = {
        x: islandGroup.position.x - 1.2,
        y: 6.8,
        z: 14.0
      };

      window.gsap.to(camera.position, {
        x: exploreCamPos.x, y: exploreCamPos.y, z: exploreCamPos.z,
        duration: 1.6, ease: "power2.inOut"
      });
      window.gsap.to(controls.target, {
        x: targetCenter.x, y: targetCenter.y, z: targetCenter.z,
        duration: 1.6, ease: "power2.inOut"
      });
    };
    resetCamBtn.onclick = resetCamera;
    modalCloseBtn.onclick = resetCamera;
    modalOverlay.onclick = (e) => { if (e.target === modalOverlay) resetCamera(); };

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    window.addEventListener('click', (e) => {
      if (modalOverlay.classList.contains('active')) return;
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      if (catModel) {
        const catHits = raycaster.intersectObjects(catGroup.children, true);
        if (catHits.length > 0) {
          focusCat();
        }
      }
    });

    /* --------------------------------------------------------------------
     * 渲染循環
     * -------------------------------------------------------------------- */
    const tempV = new THREE.Vector3();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixerIsland) mixerIsland.update(delta);

      controls.update();

      islandGroup.position.y = (isMobile ? -1.2 : 0) + Math.sin(Date.now() * 0.0015) * 0.08;

      for (let i = 0; i < animatedWaterMaterials.length; i++) {
        animatedWaterMaterials[i].offset.y += 0.003;
      }

      for (const key in labelElements) {
        const item = labelElements[key];

        if (item.isCat && catModel) {
          catGroup.getWorldPosition(tempV);
          tempV.y += 0.45;
          tempV.x += 0.18;
        } else {
          tempV.copy(item.pos);
          tempV.x += islandGroup.position.x;
          tempV.y += islandGroup.position.y;
          tempV.z += islandGroup.position.z;
        }

        tempV.project(camera);
        const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-tempV.y * 0.5 + 0.5) * window.innerHeight;

        item.el.style.left = `${x}px`;
        item.el.style.top = `${y}px`;
        item.el.style.display = tempV.z > 1 ? 'none' : 'flex';
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
